<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" role="img" aria-labelledby="title desc">
  <title id="title">Animated GitHub mark</title>
  <desc id="desc">The GitHub mark draws itself inside a terminal-style panel.</desc>
  <rect width="660" height="500" rx="22" fill="#0d1117"/>
  <rect x="1" y="1" width="658" height="498" rx="21" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/><circle cx="48" cy="28" r="6" fill="#ffbd2e"/><circle cx="68" cy="28" r="6" fill="#27c93f"/>
  <text x="330" y="34" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="15" text-anchor="middle">github-mark.svg</text>
  <g transform="translate(170 82) scale(20)">
    <path pathLength="1" d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.51-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.49 7.49 0 0 1 8 3.91c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.74.54 1.51 0 1.09-.01 1.97-.01 2.24 0 .21.15.47.55.39A8.16 8.16 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z" fill="none" stroke="#58a6ff" stroke-width=".22" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" fill="freeze"/>
      <animate attributeName="fill" values="#0d1117;#0d1117;#c9d1d9" keyTimes="0;0.72;1" dur="3.1s" fill="freeze"/>
    </path>
  </g>
  <text x="330" y="446" fill="#3fb950" font-family="ui-monospace,Consolas,monospace" font-size="22" text-anchor="middle" opacity="0">$ git status --building
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur=".5s" fill="freeze"/>
  </text>
  <rect x="485" y="427" width="12" height="24" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1" begin="2.7s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
